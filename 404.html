<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Ryan Pratt</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #09122C;
        color: #F9F6F2;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        text-align: center;
        padding: 24px;
      }
      main { max-width: 420px; }
      h1 {
        margin: 0 0 20px;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.06em;
      }
      a {
        display: inline-block;
        font-size: 13px;
        letter-spacing: 0.06em;
        color: #F9F6F2;
        text-decoration: none;
        border-bottom: 1px solid rgba(249, 246, 242, 0.35);
        padding-bottom: 2px;
        transition: border-color 160ms;
      }
      a:hover { border-color: #F9F6F2; }
      a:focus { outline: none; }
      a:focus-visible { outline: 1px solid #F9F6F2; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Nothing refracts here.</h1>
      <a href="/">← Back to the light</a>
    </main>
  </body>
</html>
