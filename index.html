    <script>
      // Set data-theme before React mounts so the first paint is never wrong,
      // and body transitions (see index.css) don't run on that first paint.
      // Default is always dark; only an explicit toggle (stored below) changes it.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          document.documentElement.dataset.theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
